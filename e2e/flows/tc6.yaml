appId: com.chronicle.app
---
- waitForAnimationToEnd
- tapOn: '^Story$'
- assertVisible: '^Story$'
- assertVisible: 'Your weeks, written back to you\.'
# Current week is the hero card: "Chapter N" meta + "The week of…" headline.
- assertVisible: 'Chapter [IVXLC]+[\s\S]*'
- assertVisible: 'The week of the [\s\S]*'
- assertVisible: '[0-9]+ entries · [0-9]+ words'
# Tap the hero card (first subtitle match) to open the chapter.
- tapOn: 'The week of the [\s\S]*'
- assertVisible: 'Back'
- assertVisible: 'Share story'
- assertVisible: 'Chapter [IVXLC]+[\s\S]*'
- assertVisible: '[0-9]+ entries · [0-9]+ words'
- assertVisible: 'On [A-Z][a-z]+day, the [\s\S]*'
- assertVisible: '[\s\S]*Walked the coast road, cold wind\.[\s\S]*'
- assertVisible: '[\s\S]*Later, remind me to call the dentist[\s\S]*'
- pressKey: back

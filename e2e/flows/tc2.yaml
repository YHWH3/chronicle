appId: com.chronicle.app
---
- waitForAnimationToEnd
- tapOn: '^Write$'
- assertVisible: 'Type your note…'
- tapOn: 'Type your note…'
- inputText: 'walked the coast road, cold wind'
- assertVisible: 'walked the coast road, cold wind'
- tapOn: '^Keep$'
- assertVisible: '^Saved$'
- assertVisible: 'Your note is saved\.'
- assertNotVisible: 'Read by[\s\S]*'
# Back to idle; the Earlier-today card (SPEAK mode only) must list the entry.
- tapOn: 'New note'
- tapOn: '^Speak$'
- assertVisible: 'Get Smart to-dos'
- assertVisible: '[0-9]+ notes? today ›'
- tapOn: 'Not now'
- assertVisible: 'Earlier today'
- assertVisible: 'walked the coast road, cold wind'

appId: com.chronicle.app
---
- waitForAnimationToEnd
- tapOn: '^Write$'
- tapOn: 'Begin anywhere. The day will shape itself.'
- inputText: 'remind me to call the dentist tomorrow at 5'
- tapOn: '^Keep$'
- assertVisible: 'Kept\.'
- assertVisible: '1 reminder set'
# "tomorrow at 5" -> 17:00 next day; meta reads "Tomorrow · 17:00 · From your journal".
- tapOn: '^Intentions$'
- assertVisible: 'What you mean to do\.'
- assertVisible: '^Intentions$'
- assertVisible: 'Call the dentist'
- assertVisible: 'Tomorrow · 17:00[\s\S]*'

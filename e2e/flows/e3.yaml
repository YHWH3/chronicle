appId: com.chronicle.app
---
- waitForAnimationToEnd
# Earlier-today card (SPEAK mode) lists the entry; Intentions shows reminders.
- tapOn: '^Speak$'
- assertVisible: 'Earlier today'
- assertVisible: 'testing a double tap safeguard'
- takeScreenshot: e3-today-entries
- tapOn: '^Intentions$'
- assertVisible: 'Stretch'
- assertVisible: '(Today|Tomorrow) · 09:00[\s\S]*'
- assertVisible: 'Water the fern'
# tc4 sets this "tomorrow" — a suite crossing midnight sees it as "Today".
- assertVisible: '(Today|Tomorrow) · 09:00[\s\S]*'
- takeScreenshot: e3-intentions
- tapOn: '^Today$'

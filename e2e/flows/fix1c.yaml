appId: com.chronicle.app
---
# Same cancel-restores-Download regression, from a cold gear-icon entry.
- waitForAnimationToEnd
- tapOn: 'Settings'
- assertNotVisible: 'The quiet particulars\.'
- tapOn: 'Voice to text'
- tapOn: '^Better voice typing · 487 MB · offline$'
- tapOn: 'Parakeet TDT 0.6B'
- scrollUntilVisible:
    element: 'Download · ≈ 487 MB'
    direction: down
- takeScreenshot: fix1c-before-getit
- tapOn: 'Download · ≈ 487 MB'
- assertVisible: 'Cancel'
- takeScreenshot: fix1c-downloading
- tapOn: 'Cancel'
- assertVisible: 'Download · ≈ 487 MB'
- takeScreenshot: fix1c-after-cancel

appId: com.chronicle.app
---
- waitForAnimationToEnd
- tapOn: '^Write$'
- tapOn: 'Type your note…'
- inputText: 'I should probably call the dentist'
- tapOn: '^Keep$'
- assertVisible: '^Saved$'
- assertVisible: 'Maybe to-dos\?'
- tapOn: '^Skip$'
- assertNotVisible: 'Maybe to-dos\?'
- tapOn: '^To-dos$'
- assertVisible: 'No to-dos yet\.'
- tapOn: '^Today$'
- tapOn: 'New note'
- tapOn: 'Type your note…'
- inputText: 'I should probably call the bank'
- tapOn: '^Keep$'
- tapOn: '^Add$'
- assertNotVisible: 'Maybe to-dos\?'
- assertVisible: '1 to-do added'
- tapOn: 'Call the bank'
- assertVisible: 'Add a time'
- tapOn: '^Tomorrow$'
- tapOn: '^Save$'
- takeScreenshot: smart3-added-with-time
- tapOn: '^To-dos$'
- assertVisible: 'Call the bank'
- assertVisible: 'Tomorrow[\s\S]*From your note'

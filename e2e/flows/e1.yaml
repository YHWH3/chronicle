appId: com.chronicle.app
---
- waitForAnimationToEnd
# KEEP with an empty draft is a no-op — the pill is disabled until text exists.
- tapOn: '^Journal$'
- takeScreenshot: e0-journal-baseline
- tapOn:
    point: '17%,93%'
- tapOn: '^Write$'
- assertVisible: 'Type your note…'
- takeScreenshot: e1-empty-keep-before
- tapOn: '^Keep$'
- assertVisible: 'Type your note…'
- takeScreenshot: e1-empty-keep-after
- tapOn: '^Journal$'
- takeScreenshot: e1-journal-after

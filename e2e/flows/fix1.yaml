appId: com.chronicle.app
---
# Regression: cancelling a model download must restore the Download action.
# Self-contained: Today → Settings → Voice to text → Parakeet → model page.
- waitForAnimationToEnd
- tapOn: 'Settings'
- tapOn: 'Voice to text'
- tapOn: '^Better voice typing · 487 MB · offline$'
- tapOn: 'Parakeet TDT 0.6B'
- scrollUntilVisible:
    element: 'Download · ≈ 487 MB'
    direction: down
- takeScreenshot: fix1-before-getit
- tapOn: 'Download · ≈ 487 MB'
- assertVisible: 'Cancel'
- takeScreenshot: fix1-downloading
- tapOn: 'Cancel'
- takeScreenshot: fix1-immediately-after-cancel
- assertVisible: 'Download · ≈ 487 MB'
- takeScreenshot: fix1-getit-returned

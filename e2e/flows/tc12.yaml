appId: com.chronicle.app
---
- waitForAnimationToEnd
- tapOn: '^Write$'
- tapOn: 'Begin anywhere. The day will shape itself.'
- inputText: 'remind me to stretch tomorrow at 9pm'
- tapOn: '^Keep$'
- takeScreenshot: tc12-hint
# "tomorrow at 9pm" -> 21:00 tomorrow — always future, meridian-explicit.
- assertVisible: 'Kept\.'
- assertVisible: '1 reminder set'
- assertVisible: 'Read by Quiet parser'
- assertVisible: 'Stretch'
- assertVisible: 'Tomorrow · 21:00'
- takeScreenshot: tc12-kept
- tapOn: '^Intentions$'
- assertVisible: 'Stretch'
- assertVisible: 'Tomorrow · 21:00[\s\S]*'
- takeScreenshot: tc12-stretch

appId: com.chronicle.app
---
- waitForAnimationToEnd
- tapOn: '^Journal$'
- assertVisible: 'Journal'
# Day labels are "Today"/"Yesterday"/"EEEE · d MMM" — no more masthead.
- assertVisible: '^Today$'
- assertVisible: 'walked the coast road, cold wind'
- assertVisible: 'remind me to call the dentist tomorrow at 5'

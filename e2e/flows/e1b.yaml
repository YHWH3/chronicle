appId: com.chronicle.app
---
- waitForAnimationToEnd
# Variant: type then erase — empty KEEP must still be a no-op.
- tapOn: '^Write$'
- tapOn: 'Type your note…'
- inputText: 'temporary'
- eraseText: 9
- assertVisible: 'Type your note…'
- takeScreenshot: e1-empty-keep-before
- tapOn: '^Keep$'
- takeScreenshot: e1-empty-keep-after
- hideKeyboard
- tapOn: '^Journal$'
- takeScreenshot: e1-journal-after

appId: com.chronicle.app
---
# Llama model page: collapsible source row + download/cancel cycle.
# The emulator's HF download fails fast (chain validation), so tolerate
# the Failed/"Try again" terminal state alongside the clean path.
- waitForAnimationToEnd
- tapOn: 'Settings'
- tapOn: 'The Mind'
- tapOn: '^On-device model$'
- tapOn: '^Llama 3.2 3B$'
- scrollUntilVisible:
    element: 'Download source'
    direction: down
- tapOn: 'Edit'
- assertVisible: 'The Llama download is licence-gated — accept Meta''s licence on huggingface.co, then paste the .task link here\.'
- assertVisible: 'https://huggingface.co[\s\S]*'
- takeScreenshot: tc11-ondevice
- scrollUntilVisible:
    element: '(^Download$|Try again)'
    direction: up
- tapOn: '(^Download$|Try again)'
- assertVisible: '(Cancel|Try again)'
- takeScreenshot: tc11-llm-downloading
- tapOn:
    text: 'Cancel'
    optional: true
- assertVisible: '(^Download$|Try again)'

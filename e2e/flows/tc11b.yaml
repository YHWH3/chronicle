appId: com.chronicle.app
---
# Llama model page: collapsible source row + download/cancel cycle.
# The emulator's HF download fails fast (chain validation), so tolerate
# the Failed/"Try again" terminal state alongside the clean path.
- waitForAnimationToEnd
- tapOn: 'Settings'
- tapOn: 'The Mind'
- tapOn: '^On-device model$'
- tapOn: '^On-device language model$'
- scrollUntilVisible:
    element: 'Download source'
    direction: down
- tapOn: 'Edit'
# After tc11 typed a URL, the field shows it; on a fresh run the
# placeholder 'Model download URL' is the match instead.
- assertVisible: '[\s\S]*licence-gated[\s\S]*'
- assertVisible: 'Bring your own model[\s\S]*'
- assertVisible: 'https://github\.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-nemo-parakeet-tdt-0\.6b-v3-int8\.tar\.bz2'
- takeScreenshot: tc11-ondevice
- scrollUntilVisible:
    element: '(^Download$|Try again)'
    direction: up
- tapOn: '(^Download$|Try again)'
- assertVisible: '(Cancel|Try again)'
- takeScreenshot: tc11-llm-downloading
- tapOn:
    text: 'Cancel'
    optional: true
- assertVisible: '(^Download$|Try again)'
